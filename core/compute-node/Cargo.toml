[package]
name = "posemesh-compute-node"
version = "0.3.3"
edition = "2021"
license = "MIT"
description = "Posemesh compute node engine: config, DDS/DMS, heartbeat, storage (no persistence)."
repository = "https://github.com/aukilabs/prompting"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
auki-p2p = { path = "../auki-p2p" }
compute-runner-api = { package = "posemesh-compute-node-runner-api", version = "0.1.2", path = "../compute-node-runner-api" }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
k256 = { workspace = true }
parking_lot = { workspace = true }
posemesh-node-registration = { version = "0.2.1", path = "../node-registration" }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "fs", "signal", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "ansi", "json", "env-filter"] }
url = { workspace = true }
uuid = { workspace = true }
posemesh-domain-http = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
httpmock = { workspace = true }
hickory-resolver = "0.24.4"
jsonwebtoken = "9.3.0"
libp2p = { workspace = true, features = ["tokio", "macros", "noise", "tcp", "yamux", "relay", "metrics"] }
libp2p-stream = { workspace = true }
once_cell = { workspace = true }
prometheus-client = "0.22.3"
rand = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "test-util",
] }
tower = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }

[features]
metrics = []
