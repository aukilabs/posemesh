[package]
name = "posemesh-compute-node"
version = "0.3.3"
edition = "2021"
license = "MIT"
description = "Posemesh runner host and storage adapters for SDK-managed workers."
repository = "https://github.com/aukilabs/posemesh"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
auki-dms = { workspace = true, features = ["client"] }
auki-auth = { workspace = true }
auki-p2p = { workspace = true }
auki-sdk = { workspace = true }
compute-runner-api = { package = "posemesh-compute-node-runner-api", version = "0.1.2", path = "../compute-node-runner-api" }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "fs", "signal", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "ansi", "json", "env-filter"] }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
p256 = { workspace = true }
sha2 = { workspace = true }
tower = { workspace = true, features = ["util"] }
async-trait = { workspace = true }
futures = { workspace = true }
httpmock = { workspace = true }
jsonwebtoken = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "test-util",
] }
zip = { workspace = true }
tempfile = { workspace = true }

[features]
metrics = []
