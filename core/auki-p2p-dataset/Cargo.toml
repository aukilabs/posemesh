[package]
name = "auki-p2p-dataset"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false
description = "Authenticated immutable dataset protocol for auki-p2p"
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
auki-p2p = { workspace = true }
auki-sdk = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
jsonwebtoken = "9.3.0"
libp2p = { workspace = true, features = ["tokio", "macros", "noise", "tcp", "yamux", "relay"] }
libp2p-stream = { workspace = true }
tempfile = { workspace = true }
